name: Smart Keeper (Free Tier Manager)

on:
  schedule:
    # Roda a cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keeper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Smart Ping
        env:
          URL_BOLAO: ${{ secrets.URL_BOLAO }}
          URL_EVOLUTION: ${{ secrets.URL_EVOLUTION }}
        run: python .github/scripts/smart_ping.py
