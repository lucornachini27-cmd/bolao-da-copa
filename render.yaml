# Render Blueprint — cria o serviço web automaticamente a partir deste arquivo.
# Os segredos (sync: false) você preenche no painel do Render, não ficam no código.
services:
  - type: web
    name: bolao-da-copa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_USER
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE_NAME
        sync: false
      - key: WHATSAPP_TARGET_NUMBER
        sync: false
